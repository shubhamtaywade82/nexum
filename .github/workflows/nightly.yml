name: Nightly Integration

# PRODUCTION_AUDIT #24: the main CI lane runs with SKIP_NETWORK_TESTS=true on
# every job, so the real-network suites (Binance WebSocket, real-Chromium
# browser, Docker sandbox daemon) are only ever compile- or mock-tested in CI.
# This nightly lane runs them for real on a schedule, plus the packed-artifact
# smoke, so integration drift is caught within a day instead of at release
# time. Failures page the same commit status as the main lane.
# MAC v1 P7 (issue #85): the deterministic multi-agent evaluation suite runs
# here as a gate — the SPEC §15 promotion thresholds as the exit criteria of
# `nexum eval --multi-agent`, with labeled outcomes accumulating across runs
# toward the ≥ 100 calibration dataset.
on:
  schedule:
    # 03:15 UTC — off-peak, after the day's merges have settled.
    - cron: "15 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nightly-integration
  cancel-in-progress: false

jobs:
  network:
    name: Real-network suites (Node 22.x)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ""
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: nexum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps
        env:
          HUSKY: "0"

      - name: Install Playwright Chromium
        # The browser tests launch real Chromium; the main lane skips them
        # when the binary is absent, so it never notices a broken install.
        run: npx playwright install --with-deps chromium

      - name: Run real-network test suites
        # SKIP_NETWORK_TESTS deliberately UNSET → the Binance WebSocket /
        # paper-trading suites run against the real public endpoints.
        run: >
          NEXUM_TEST_NO_GLOBAL=true
          node --experimental-vm-modules node_modules/jest/bin/jest.js
          tests/domains/trading tests/tools tests/browser tests/server tests/protocol
          --runInBand
        env:
          CI: true
          TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/nexum_test
          NODE_OPTIONS: --max-old-space-size=6144

  docker:
    name: Docker sandbox integration (Node 22.x)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps
        env:
          HUSKY: "0"

      - name: Build sandbox image
        run: docker build -t nexum-sandbox:latest docker/nexum-sandbox/

      - name: Run Docker daemon integration tests
        run: npm run test:docker
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=6144

  package-smoke:
    name: Packed artifact smoke (Node 22.x)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps
        env:
          HUSKY: "0"

      - name: Build and validate packed artifact
        run: npm run build && npm run package:check
        env:
          CI: true
          SKIP_NETWORK_TESTS: true

  keychain:
    # Phase 3 (beta) gate — RELEASE-READINESS.md §3 requires a real Linux
    # keychain round-trip test. tests/credentials/vault-keychain.test.ts is
    # fully mocked (injected fakes); this job exercises the real
    # libsecret / secret-tool path the provider talks to, so integration
    # drift (API changes, D-Bus issues, gnome-keyring permission problems)
    # surfaces within a day instead of at release time.
    name: Linux keychain live round-trip (Node 22.x)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install libsecret + D-Bus + gnome-keyring
        # libsecret-tools provides `secret-tool`; dbus-x11 provides
        # dbus-run-session; gnome-keyring is the Secret Service implementation.
        run: sudo apt-get update && sudo apt-get install -y libsecret-tools dbus-x11 gnome-keyring

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps
        env:
          HUSKY: "0"

      - name: Run Linux keychain live round-trip test
        # dbus-run-session gives the test a private session bus; inside it,
        # gnome-keyring unlocks the default keyring with an empty password,
        # which the Secret Service requires before it accepts writes.
        run: >
          dbus-run-session --
          env NEXUM_KEYCHAIN_LIVE_TESTS=1 NEXUM_TEST_NO_GLOBAL=true SKIP_NETWORK_TESTS=true
          node --experimental-vm-modules node_modules/jest/bin/jest.js
          tests/credentials/keychain-linux-roundtrip.test.ts --runInBand
        env:
          CI: true

  multi-agent-eval:
    # MAC v1 P7 (issue #85 PR 7.2): the deterministic multi-agent evaluation
    # suite as a nightly gate — `nexum eval --multi-agent` applies the SPEC §15
    # promotion thresholds (evidence coverage ≥ 98%, observation accuracy
    # ≥ 95%, risk recall ≥ 0.80, abstention precision ≥ 0.95, 100% invalid-DAG
    # rejection, 100% budget adherence, 0 successful escalations, 0 false
    # successes — the hard north-star gate). Fully deterministic: no model,
    # no network, no docker. Docker-gated eval cases (sandboxed shell
    # collectors) run only under NEXUM_DOCKER_TESTS=1, which stays unset here.
    name: Multi-agent evaluation gates (deterministic, Node 22.x)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps
        env:
          HUSKY: "0"

      - name: Run the deterministic multi-agent evaluation suite (SPEC §15 gates)
        # Exit code = the gate verdict: any threshold regression pages the
        # same commit status as the rest of the nightly lane. The labeled
        # outcomes file accumulates across scheduled runs under
        # .nexum/evals/multi-agent (idempotent per labelId — no inflation).
        run: npm run eval -- --multi-agent --out .nexum/evals/multi-agent
        env:
          CI: true
          SKIP_NETWORK_TESTS: "true"
