name: Release & Publish

on:
  push:
    tags:
      - "v*.*.*"
      - "*.*.*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the current package version to npm"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish to NPM & GitHub Release
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ""
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: nexum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        env:
          HUSKY: "0"

      - name: Verify release version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
              echo "Tag version $TAG_VERSION does not match package version $PACKAGE_VERSION"
              exit 1
            fi
          fi

          echo "Release version: $PACKAGE_VERSION"

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run release validation
        run: npm run release:check
        env:
          CI: true
          SKIP_NETWORK_TESTS: true
          TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/nexum_test
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Compute dist-tag
        id: dist
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          # npm applies the `latest` dist-tag to every publish by default —
          # including prerelease versions. Prereleases must land on `next`
          # so a bare `npm install @nemesis-oss/nexum` never resolves to an
          # alpha/beta/rc. See RELEASE-READINESS.md blocker B4.
          if [[ "$VERSION" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to NPM Registry
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
        run: |
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "Publishing via NPM_TOKEN secret..."
            NODE_AUTH_TOKEN="${{ secrets.NPM_TOKEN }}" npm publish --provenance --access public --tag "${{ steps.dist.outputs.tag }}"
          else
            echo "Publishing via npm OIDC trusted publishing (provenance enabled)..."
            npm publish --provenance --access public --tag "${{ steps.dist.outputs.tag }}"
          fi

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
