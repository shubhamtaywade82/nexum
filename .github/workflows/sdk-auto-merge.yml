# Merges Dependabot's @nemesis-oss/ollama-sdk minor and patch upgrades once CI has
# passed for the PR head. Major upgrades, and any PR that changes more than the SDK
# version, are left open for a person.
#
# workflow_run runs from the default branch, and this job never checks out code from
# the pull request. The PR is found through the GitHub API.

name: SDK auto-merge

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sdk-auto-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  merge:
    name: Merge verified SDK upgrade
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Test the decision logic
        run: node --test .github/scripts/sdk-auto-merge.test.mjs

      - name: Merge if the upgrade is minor or patch only
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node .github/scripts/sdk-auto-merge.mjs
