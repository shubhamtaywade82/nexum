# Nexum Evolution Task Catalogue
#
# This is the machine-readable source of truth for the catalogue.
# Human-readable view: docs/evolution/task-catalog.md
# Architecture:        docs/evolution/architecture.md
# Policy:              docs/evolution/evolution-policy.md
#
# Editing rules:
#   - Bump `version` only when the schema changes (new required field, renamed
#     section, etc.). Adding or revising a task does NOT bump `version`.
#   - Each task carries a `schema_version` (default 1). Bump it when the
#     task's contract changes; this invalidates older reports citing the same id.
#   - Do not edit this file from an `implement`-mode task. The catalogue is on
#     the forbidden-paths list for the mutation executor.
#
version: 1

tasks:
  - id: EVO-001
    title: "Episode Capture Reliability"
    category: learning
    priority: P0
    schema_version: 1
    objective: >-
      Verify every completed task produces a correctly structured, persisted episode, and that no execution path silently drops episodes.
    execution:
      mode: diagnose
      autonomous: true
      allow_code_changes: false
    inputs:
      - episode_store
      - lesson_store
      - orchestrator_lifecycle
    investigation:
      - "Inspect episode write paths in the orchestrator and agent runtime."
      - "Confirm episodes are persisted on success, failure, timeout, and cancellation."
      - "Check that episode schema (goal, startedAt, endedAt, toolEvents, terminal, grade) is fully populated."
      - "Identify execution paths that exit without persisting an episode."
      - "Sample recent runs and verify each has a corresponding episode row."
    acceptance:
      - "Findings reference actual code paths and a sampled audit of recent runs."
      - "Every silent-drop path is listed with a file:line citation."
      - "Schema completeness is reported as a percentage over the sample."
      - "Recommendations distinguish persistence bugs from schema gaps."
    report:
      required:
        - task_identification
        - current_implementation
        - current_behavior
        - identified_gaps
        - root_cause_analysis
        - improvement_proposals
        - expected_impact
        - risk_assessment
        - implementation_plan
        - verification_plan
        - recommendation
        - confidence
    scoring:
      impact: 0.95
      potential: 0.7
      feasibility: 0.85
    depends_on: []

