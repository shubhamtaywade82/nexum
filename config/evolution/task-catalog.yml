      allow_code_changes: false
    inputs:
      - episode_store
      - experience_store
      - trajectory_analyzer
      - evidence_aggregator
    investigation:
      - "Inspect the episode to experience record pipeline."
      - "Verify ingestion triggers fire on episode completion, not on CLI command."
      - "Check that trajectory analysis and evidence aggregation run as part of ingestion."
      - "Identify episodes that completed but produced no experience record."
      - "Measure ingestion lag from episode end to experience record commit."
    acceptance:
      - "Ingestion trigger path is documented with file:line citations."
      - "Missing-ingestion episodes are enumerated and root-caused."
      - "Ingestion lag is reported as a distribution, not a single number."
      - "Recommendations separate plumbing fixes from policy changes."
    report:
      required:
        - task_identification
        - current_implementation
        - current_behavior
        - identified_gaps
        - root_cause_analysis
        - improvement_proposals
        - expected_impact
        - risk_assessment
        - implementation_plan
        - verification_plan
        - recommendation
        - confidence
    scoring:
      impact: 0.9
      potential: 0.65
      feasibility: 0.8
    depends_on:
      - EVO-001

  - id: EVO-003
    title: "Success Pattern Discovery"
    category: learning
    priority: P0
    schema_version: 1
