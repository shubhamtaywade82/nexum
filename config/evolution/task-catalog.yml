      - two_stage_selector
      - benchmark
    investigation:
      - "Inspect baseline selection (parent commit, parent harness)."
      - "Verify workloads are identical between baseline and candidate."
      - "Check that benchmark seeds are fixed across runs."
      - "Identify comparisons that used a stale or wrong baseline."
      - "Confirm baseline metrics are recorded in the experiment artifact."
    acceptance:
      - "Baseline selection logic is documented."
