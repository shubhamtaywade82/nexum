      - experience_store
      - skill_registry
    investigation:
      - "Analyze successful task episodes (verdict=success)."
      - "Group episodes by task class, model, tools used, and execution strategy."
      - "Identify repeated successful patterns (tool sequences, context choices, planning shapes)."
      - "Evaluate independent evidence and confidence for each pattern (de-duplicate episodes)."
      - "Identify possible reusable skills or runtime improvements."
      - "Compare patterns with current runtime behavior to find gaps."
    acceptance:
      - "Findings reference actual episode evidence (episode ids are cited)."
      - "Duplicate episodes do not count as independent evidence."
      - "Patterns include confidence and sample size."
      - "Recommendations include measurable outcomes."
      - "Insufficient evidence is explicitly reported, not papered over."
